version: '3.8'

services:
  kafka-broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka-broker:9092,CONTROLLER://kafka-broker:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 100
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 10
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - kafka-network


  map:
    build:
      context: .
      dockerfile: Dockerfile-map
    ports:
      - "8080-8083:8080"
#    deploy:
#      replicas: 3
    depends_on:
      - kafka-broker
    networks:
      - kafka-network

  reduce:
    build:
      context: .
      dockerfile: Dockerfile-reduce
    ports:
      - "8084-8087:8080"
#    deploy:
#      replicas: 3
    depends_on:
      - kafka-broker
    networks:
      - kafka-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile-gateway
    ports:
      - "8088-8091:8080"
    depends_on:
      - kafka-broker
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
