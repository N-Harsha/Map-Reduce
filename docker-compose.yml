version: '3.8'

services:
  map:
    build:
      context: .
      dockerfile: Dockerfile.map
    ports:
      - "9090-9099:8080"
    deploy:
      replicas: 3

  reduce:
    build:
      context: .
      dockerfile: Dockerfile.reduce
    ports:
      - "9091-9099:8080"
    deploy:
      replicas: 3

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "9092-9099:8080"